    :root {
      color-scheme: light;
    }
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      -webkit-font-smoothing: antialiased;
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    .glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }

    .btn-press {
      transition: transform .12s ease, box-shadow .12s ease, background-color .2s ease;
    }
    .btn-press:active {
      transform: scale(0.97);
    }

    .tab-active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
      border-radius: 3px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
    }

  /* Confetti canvas */
  .confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 100;
  }

  /* PWA slide animations */
  @keyframes slideDown {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

    /* Wave animation for voice */
    .wave-bar {
      display: inline-block;
      width: 3px;
      margin: 0 2px;
      background: #6366F1;
      border-radius: 2px;
      animation: wave 1s ease-in-out infinite;
    }
    @keyframes wave {
      0%, 100% { height: 6px; }
      50% { height: 24px; }
    }

    .no-select {
      user-select: none;
      -webkit-user-select: none;
    }

    /* Hide number input arrows */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }

    /* Loading skeleton for faster perceived performance */
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
      border-radius: 4px;
    }
    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Offline mode: adjust layout so banner doesn't cover content */
    body.is-offline #app-main {
      padding-top: 36px;
    }

    /* ===== Mobile Optimizations ===== */
    /* Safe area support */
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    .px-safe { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

    /* Minimum touch target 44x44px */
    .touch-target {
      min-width: 44px;
      min-height: 44px;
    }
    .touch-target-sm {
      min-width: 36px;
      min-height: 36px;
    }

    /* Prevent text size adjustment on orientation change */
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      touch-action: manipulation;
    }

    /* Disable double-tap zoom globally via touch-action */
    button, a, [role="button"], input, textarea, select, label {
      touch-action: manipulation;
    }

    /* Keyboard-aware scroll padding */
    .keyboard-pad {
      padding-bottom: env(keyboard-inset-height, 0px);
    }

    /* Mobile viewport height fix */
    .h-dvh { height: 100dvh; }
    .min-h-dvh { min-height: 100dvh; }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .wave-bar { animation: none !important; }
    }

    /* Mobile-specific layout adjustments */
    @media (max-width: 428px) {
      .mobile-compact .text-xl { font-size: 1.125rem; line-height: 1.5rem; }
      .mobile-compact .text-lg { font-size: 1rem; line-height: 1.5rem; }
      .mobile-compact .text-base { font-size: 0.9375rem; line-height: 1.375rem; }
      .mobile-compact .text-sm { font-size: 0.8125rem; line-height: 1.25rem; }
      .mobile-compact .text-xs { font-size: 0.75rem; line-height: 1.125rem; }
      .mobile-compact .p-4 { padding: 0.75rem; }
      .mobile-compact .p-5 { padding: 1rem; }
      .mobile-compact .p-6 { padding: 1rem; }
      .mobile-compact .gap-4 { gap: 0.75rem; }
      .mobile-compact .gap-3 { gap: 0.625rem; }
      .mobile-compact .mb-4 { margin-bottom: 0.75rem; }
      .mobile-compact .mb-6 { margin-bottom: 1rem; }
      .mobile-compact .rounded-2xl { border-radius: 0.875rem; }
      .mobile-compact .rounded-xl { border-radius: 0.75rem; }
    }

    /* Tablet landscape dual-column support */
    @media (min-width: 768px) and (max-width: 1024px) and (orientation: landscape) {
      .tablet-dual {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
    }

    /* Image lazy loading placeholder */
    img[loading="lazy"] {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
    }

    /* Ripple animation */
    @keyframes ripple {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(300); opacity: 0; }
    }
    .animate-ripple {
      animation: ripple 0.6s ease-out forwards;
    }

    /* Fade in */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }

    /* Slide up */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.4s ease-out forwards;
    }

    /* Shake for error feedback */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .animate-shake {
      animation: shake 0.4s ease-in-out;

    /* Skeleton shimmer */
    @keyframes skeletonShimmer {
      0% { background-position: -200% 0; }

    .skeleton-shimmer {

    }
    .page-transition-enter-active {

      transform: translateY(0);

    }
    .page-transition-exit {
      opacity: 1;
      transform: translateY(0);
    }
    .page-transition-exit-active {
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.15s ease-in, transform 0.15s ease-in;

  <!-- Lazy-load orchestrator -->
  <script>
    // Lazy module loader: fetches JSX source, compiles with Babel, then evals inline.
    // More reliable than deferring to Babel.transformScriptTags() which is async and
    // does not provide a completion callback.
    (function() {
      window.__lazyLoaded = window.__lazyLoaded || {};

      function fetchText(url) {
        return fetch(url).then(function(r) { return r.text(); });
      }

      function compileAndEval(source, filename) {
        if (!window.Babel || typeof Babel.transform !== 'function') {
          console.warn('[LazyLoad] Babel not ready for', filename);
          return;
        }
        var result = Babel.transform(source, {
          presets: ['react'],
          filename: filename,
        });
        // eval in global scope
        var script = document.createElement('script');
        script.text = result.code;
        document.head.appendChild(script);
        document.head.removeChild(script);
      }

      window.loadLazyModule = function(group) {
        if (window.__lazyLoaded[group]) return Promise.resolve();
        window.__lazyLoaded[group] = true;

        var placeholders = document.querySelectorAll('script[data-lazy="' + group + '"]');
        if (!placeholders.length) return Promise.resolve();

        var srcs = Array.from(placeholders).map(function(ph) {
          return ph.getAttribute('data-src');
        }).filter(Boolean);

        // Fetch all sources in parallel
        return Promise.all(srcs.map(fetchText)).then(function(sources) {
          // Compile sequentially to respect potential intra-group dependencies
          sources.forEach(function(src, i) {
            if (src) compileAndEval(src, srcs[i]);
          });
        }).catch(function(err) {
          console.warn('[LazyLoad] Failed to load group', group, err);
        });
      };

      // Preload next likely tab after first paint
      if (window.addEventListener) {
        window.addEventListener('load', function() {
          setTimeout(function() {
            window.loadLazyModule('learning');
          }, 2500);
        });
      }
    })();
  </script>
